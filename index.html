<!DOCTYPE html>
<html lang="mk">

<head>
  <meta charset="UTF-8">
  <title>💘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 40px;
      font-size: clamp(24px, 6vw, 38px);
      padding: 0 15px;
      animation: fadeIn 2s ease-in-out;
    }

    img {
      margin-top: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      height: auto;
    }

    /* BUTTONS */

    .buttons {
      margin-top: 30px;
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 200px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s ease;
      color: white;
      font-weight: bold;
    }

    #yes {
      background: #ff4d6d;
      z-index: 2;
    }

    #no {
      background: #6c757d;
      position: absolute;
      left: 220px;
      top: 80px;
      transition: 0.12s linear;
    }

    /* POPUPS */

    .popup {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
    }

    .popup-content {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 25px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    /* MOOD */

    .mood-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .mood-card {
      background: #ffe5ec;
      color: black;
      padding: 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mood-card span {
      font-size: 14px;
      font-weight: bold;
    }

    .mood-card.active {
      background: #ff4d6d;
      color: white;
    }

    /* INPUTS */

    .input-box input,
    .custom-select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    #next,
    #confirm {
      background: #ff4d6d;
      margin-top: 25px;
      padding: 12px 20px;
      border-radius: 50px;
      color: white;
      border: none;
    }

    /* HEARTS */

    .heart {
      position: fixed;
      bottom: -20px;
      color: pink;
      animation: floatUp 6s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .celebrate {
      animation: zoomIn 1s ease forwards;
    }

    @keyframes zoomIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
  </style>
</head>

<body>

<h1>Дали сакаш да дојдам? 💖</h1>

<img src="avt.jpg">

<div class="buttons">
  <button id="yes">Да 💕</button>
  <button id="no">Не 😢</button>
</div>

<!-- POPUP 1 -->
<div id="popup" class="popup">
  <div class="popup-content">

    <h2>Во кој mood си? 💖</h2>

    <div class="mood-options">
      <div class="mood-card" data-mood="🍔 Храна">🍔<span>Храна</span></div>
      <div class="mood-card" data-mood="🎬 Netflix">🎬<span>Netflix</span></div>
      <div class="mood-card" data-mood="💕 Sex">💕<span>Sex</span></div>
    </div>

    <button id="next">Следно 💕</button>
  </div>
</div>

<!-- POPUP 2 -->
<div id="popup2" class="popup">
  <div class="popup-content">

    <h2>Детали 💖</h2>

    <div id="extra-options"></div>

    <input type="date" id="date" style="margin-top:10px;">
    <input type="time" id="time" style="margin-top:10px;">

    <button id="confirm">Потврди 💕</button>
  </div>
</div>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

const popup = document.getElementById("popup");
const popup2 = document.getElementById("popup2");

const nextBtn = document.getElementById("next");
const confirmBtn = document.getElementById("confirm");

const buttonsContainer = document.querySelector(".buttons");
const moodCards = document.querySelectorAll(".mood-card");
const extraOptions = document.getElementById("extra-options");

let selectedMood = "";
let textIndex = 0;

const noTexts = ["Не 😢","Неее 😭","Зашто? 🥺","Стварно?? 😩","Последна шанса😅"];

/* MOOD SELECT */
moodCards.forEach(card => {
  card.onclick = () => {
    moodCards.forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    selectedMood = card.dataset.mood;
  };
});

/* MOVE NO BUTTON (FIXED MOBILE + FAST) */
function moveButton() {

  const yesRect = yesBtn.getBoundingClientRect();
  const containerRect = buttonsContainer.getBoundingClientRect();

  const range = 140;

  let x = (yesRect.left - containerRect.left) + (Math.random() * range - range/2);
  let y = (yesRect.top - containerRect.top) + (Math.random() * range - range/2);

  x = Math.max(0, Math.min(x, buttonsContainer.offsetWidth - noBtn.offsetWidth));
  y = Math.max(0, Math.min(y, buttonsContainer.offsetHeight - noBtn.offsetHeight));

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  textIndex = (textIndex + 1) % noTexts.length;
  noBtn.innerHTML = noTexts[textIndex];

  yesBtn.style.fontSize =
    (parseFloat(getComputedStyle(yesBtn).fontSize) + 1) + "px";
}

/* DESKTOP */
noBtn.addEventListener("mouseenter", moveButton);

/* MOBILE FIX - instant reaction */
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveButton();
});

/* EXTRA MOBILE tracking */
document.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && el.id === "no") moveButton();
}, { passive:false });

/* YES */
yesBtn.onclick = () => popup.style.display = "flex";

/* NEXT */
nextBtn.onclick = () => {

  if (!selectedMood) return alert("Избери mood 😄");

  popup.style.display = "none";
  popup2.style.display = "flex";

  if (selectedMood.includes("Храна")) {
    extraOptions.innerHTML = `
      <label>🍔 Што јадеме?</label>
      <select class="custom-select">
        <option>Pizza</option>
        <option>Burger</option>
        <option>Sushi</option>
      </select>
    `;
  }

  else if (selectedMood.includes("Netflix")) {
    extraOptions.innerHTML = `
      <label>🎬 Филм?</label>
      <input type="text" placeholder="Напиши филм...">
    `;
  }

  else if (selectedMood.includes("Sex")) {
    extraOptions.innerHTML = `
      <label>💕 Mode</label>
      <select class="custom-select">
        <option>Со заштита 🛡️</option>
        <option>Без заштита 😅</option>
      </select>
    `;
  }
};

/* CONFIRM */
confirmBtn.onclick = () => {

  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  if (!date || !time) return alert("Избери дата и време 💖");

  document.body.innerHTML = `
    <h1 class="celebrate">
      💘 Done!<br><br>
      ${selectedMood}<br>
      📅 ${date}<br>
      ⏰ ${time}
    </h1>
  `;
};

</script>

</body>
</html>
